output: default
streamtags: []
groups: {}
asyncFuncTimeout: 1000
functions:
  - id: comment
    filter: "true"
    disabled: null
    conf:
      comment: >-
        This conditioning pipeline is for Windows Event Logs that will be
        delivered to Google Security Operations (SecOps). Currently the pipeline
        maintains the full fidelity XML logs and sets the proper log type for
        default parsers in Google SecOps. 


        Additionally a custom namespace is able to be provided either through setting in Knowledge > Variables > Google_SecOps_Namespace or within the pipeline itself.
  - id: comment
    filter: "true"
    disabled: null
    conf:
      comment: For additional details, see this pack's README under Settings.
  - id: comment
    filter: "true"
    disabled: null
    conf:
      comment: "Author: Cribl Packs Team"
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - disabled: false
          name: __logType
          value: "'WINEVTLOG'"
        - disabled: false
          name: __namespace
          value: namespace || C.vars.Google_SecOps_Namespace
    description: Set the proper Log Type and Namespace for Google Security
      Operations (SecOps) ingestion.
description: ""
